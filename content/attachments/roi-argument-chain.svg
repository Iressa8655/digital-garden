<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#FAF9FB" stroke="#E4E0E8"/>

  <text x="32" y="42" font-size="17" font-weight="700" fill="#3D3846">The whole argument, in five steps</text>
  <text x="32" y="63" font-size="12.5" fill="#8A8290">Each box is caused by the one above it. The fix only exists at the bottom.</text>

  <!-- 1 -->
  <rect x="32" y="86" width="696" height="40" rx="8" fill="#C9C3D0" opacity="0.5"/>
  <circle cx="60" cy="106" r="13" fill="#8A8290"/>
  <text x="60" y="111" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="86" y="111" font-size="13.5" fill="#3D3846"><tspan font-weight="700">Almost every enterprise pilot returned nothing measurable.</tspan></text>

  <path d="M380 128 L380 142" stroke="#8A8290" stroke-width="1.5"/>
  <path d="M375 137 L380 144 L385 137 Z" fill="#8A8290"/>

  <!-- 2 -->
  <rect x="32" y="148" width="696" height="46" rx="8" fill="#C4A882" opacity="0.32"/>
  <circle cx="60" cy="171" r="13" fill="#C4A882"/>
  <text x="60" y="176" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="86" y="168" font-size="13.5" font-weight="700" fill="#3D3846">Because value was measured before cost was.</text>
  <text x="86" y="186" font-size="12" fill="#5F5866">A demo gets funded. Nobody names the cost line that was supposed to fall.</text>

  <path d="M380 196 L380 210" stroke="#8A8290" stroke-width="1.5"/>
  <path d="M375 205 L380 212 L385 205 Z" fill="#8A8290"/>

  <!-- 3 -->
  <rect x="32" y="216" width="696" height="46" rx="8" fill="#C4A882" opacity="0.32"/>
  <circle cx="60" cy="239" r="13" fill="#C4A882"/>
  <text x="60" y="244" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="86" y="236" font-size="13.5" font-weight="700" fill="#3D3846">And because the model layer became a commodity.</text>
  <text x="86" y="254" font-size="12" fill="#5F5866">Open weights sit near the frontier at a fraction of the price. Anyone can buy the same capability.</text>

  <path d="M380 264 L380 278" stroke="#8A8290" stroke-width="1.5"/>
  <path d="M375 273 L380 280 L385 273 Z" fill="#8A8290"/>

  <!-- 4 -->
  <rect x="32" y="284" width="340" height="58" rx="8" fill="#FFFFFF" stroke="#C9C3D0" stroke-width="1.3"/>
  <circle cx="60" cy="307" r="13" fill="#8A8290"/>
  <text x="60" y="312" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="86" y="304" font-size="13" font-weight="700" fill="#3D3846">So a thin layer is not a company</text>
  <text x="86" y="322" font-size="11.5" fill="#5F5866">the models absorb it</text>

  <!-- 5 -->
  <rect x="388" y="284" width="340" height="58" rx="8" fill="#6B3B7E"/>
  <circle cx="416" cy="307" r="13" fill="#FFFFFF"/>
  <text x="416" y="312" font-size="12.5" font-weight="700" fill="#6B3B7E" text-anchor="middle">5</text>
  <text x="442" y="304" font-size="13" font-weight="700" fill="#FFFFFF">A moat is the only real asset</text>
  <text x="442" y="322" font-size="11.5" fill="#EDE6F2">and the only answer on this list</text>
</svg>
