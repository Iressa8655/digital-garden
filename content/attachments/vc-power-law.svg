<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#FAF9FB" stroke="#E4E0E8"/>

  <text x="32" y="42" font-size="17" font-weight="700" fill="#3D3846">Top funds do not have fewer misses. They have bigger hits.</text>
  <text x="32" y="63" font-size="12.5" fill="#8A8290">Schematic shape of returns across the deals in a single successful fund.</text>

  <!-- baseline -->
  <line x1="48" y1="252" x2="728" y2="252" stroke="#C9C3D0" stroke-width="1.2"/>

  <!-- zero / near-zero deals -->
  <g fill="#C9C3D0">
    <rect x="56" y="248" width="20" height="4" rx="2"/>
    <rect x="84" y="248" width="20" height="4" rx="2"/>
    <rect x="112" y="248" width="20" height="4" rx="2"/>
    <rect x="140" y="246" width="20" height="6" rx="2"/>
    <rect x="168" y="246" width="20" height="6" rx="2"/>
    <rect x="196" y="244" width="20" height="8" rx="2"/>
    <rect x="224" y="242" width="20" height="10" rx="2"/>
    <rect x="252" y="240" width="20" height="12" rx="2"/>
  </g>

  <!-- modest returns -->
  <g fill="#B9A9C4">
    <rect x="280" y="230" width="20" height="22" rx="2"/>
    <rect x="308" y="224" width="20" height="28" rx="2"/>
    <rect x="336" y="216" width="20" height="36" rx="2"/>
    <rect x="364" y="208" width="20" height="44" rx="2"/>
    <rect x="392" y="196" width="20" height="56" rx="2"/>
    <rect x="420" y="184" width="20" height="68" rx="2"/>
  </g>

  <!-- good returns -->
  <g fill="#C4A882">
    <rect x="448" y="166" width="20" height="86" rx="2"/>
    <rect x="476" y="150" width="20" height="102" rx="2"/>
    <rect x="504" y="132" width="20" height="120" rx="2"/>
  </g>

  <!-- the fund returner -->
  <rect x="560" y="96" width="26" height="156" rx="3" fill="#6B3B7E" opacity="0.55"/>
  <rect x="600" y="52" width="30" height="200" rx="3" fill="#6B3B7E"/>

  <text x="652" y="70" font-size="12.5" font-weight="700" fill="#6B3B7E">The fund returner</text>
  <text x="652" y="88" font-size="11.5" fill="#5F5866">one or two positions</text>
  <text x="652" y="104" font-size="11.5" fill="#5F5866">carry nearly all of it</text>

  <!-- annotations -->
  <path d="M56 268 L272 268" stroke="#8A8290" stroke-width="1.1"/>
  <text x="164" y="286" font-size="11.5" fill="#5F5866" text-anchor="middle">a large share go to zero</text>
  <text x="164" y="302" font-size="11" fill="#8A8290" text-anchor="middle">this is expected, not a failure of process</text>

  <path d="M280 268 L524 268" stroke="#8A8290" stroke-width="1.1"/>
  <text x="402" y="286" font-size="11.5" fill="#5F5866" text-anchor="middle">respectable outcomes</text>
  <text x="402" y="302" font-size="11" fill="#8A8290" text-anchor="middle">good for founders, immaterial to the fund</text>

  <text x="32" y="322" font-size="11" fill="#8A8290">Schematic, not measured data. The pattern is consistent across published fund-returns research.</text>
</svg>
