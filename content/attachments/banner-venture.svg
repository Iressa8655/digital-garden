<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EFF6"/>
      <stop offset="55%" stop-color="#F7F2EC"/>
      <stop offset="100%" stop-color="#FAF9FB"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6B3B7E"/>
      <stop offset="100%" stop-color="#9A6FA8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C4A882"/>
      <stop offset="100%" stop-color="#DCC7A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#6B3B7E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6B3B7E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="16" fill="url(#ground)"/>
  <rect x="0" y="0" width="1200" height="280" rx="16" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#6B3B7E" stroke-opacity="0.055" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
  </g>

  <!-- the long tail of deals that go nowhere -->
  <g fill="#B7AEC0" fill-opacity="0.55">
    <rect x="60" y="230" width="18" height="8" rx="4"/>
    <rect x="92" y="230" width="18" height="8" rx="4"/>
    <rect x="124" y="228" width="18" height="10" rx="4"/>
    <rect x="156" y="228" width="18" height="10" rx="4"/>
    <rect x="188" y="226" width="18" height="12" rx="4"/>
    <rect x="220" y="224" width="18" height="14" rx="4"/>
    <rect x="252" y="220" width="18" height="18" rx="4"/>
    <rect x="284" y="215" width="18" height="23" rx="4"/>
  </g>

  <!-- modest outcomes -->
  <g fill="#A78FB4" fill-opacity="0.7">
    <rect x="316" y="204" width="18" height="34" rx="4"/>
    <rect x="348" y="194" width="18" height="44" rx="4"/>
    <rect x="380" y="182" width="18" height="56" rx="4"/>
    <rect x="412" y="168" width="18" height="70" rx="4"/>
  </g>

  <!-- good outcomes -->
  <g fill="url(#gold)">
    <rect x="444" y="150" width="18" height="88" rx="4"/>
    <rect x="476" y="132" width="18" height="106" rx="4"/>
    <rect x="508" y="114" width="18" height="124" rx="4"/>
  </g>

  <!-- near misses -->
  <rect x="548" y="88" width="22" height="150" rx="5" fill="url(#spire)" opacity="0.45"/>
  <rect x="586" y="70" width="22" height="168" rx="5" fill="url(#spire)" opacity="0.62"/>

  <!-- the fund returner -->
  <rect x="628" y="34" width="30" height="204" rx="6" fill="url(#spire)"/>
  <circle cx="643" cy="24" r="7" fill="#C4A882"/>

  <!-- baseline -->
  <line x1="48" y1="240" x2="700" y2="240" stroke="#6B3B7E" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- right-hand plate -->
  <g>
    <text x="760" y="118" font-size="34" font-weight="700" fill="#3D3846" font-family="Georgia, 'Times New Roman', serif">Ventures</text>
    <line x1="761" y1="134" x2="820" y2="134" stroke="#C4A882" stroke-width="3" stroke-linecap="round"/>
    <text x="760" y="166" font-size="15" fill="#5F5866">Notes from the investing side of the desk</text>
    <text x="760" y="190" font-size="13.5" fill="#8A8290">Early-stage AI, and the arithmetic underneath it</text>
  </g>
</svg>
